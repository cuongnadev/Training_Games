<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0d1117; font-family: Arial, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }

    /* Khung game: cao tối đa 94% màn hình, rộng theo tỉ lệ 9:16 */
    #frame {
      display: flex; flex-direction: column;
      height: 94vh; max-height: 900px;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      background: #111827;
      border: 2px solid #2b3445;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
    }
    #canvas-wrap { position: relative; flex: 1; min-height: 0; background: #231F20; }
    #unity-canvas { width: 100%; height: 100%; display: block; }

    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #231F20; color: #fff; font-size: 14px; gap: 12px;
    }
    #bar-bg { width: 60%; height: 8px; background: #444; border-radius: 4px; overflow: hidden; }
    #bar { width: 0%; height: 100%; background: #fff; }

    #footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 18px; color: #fff; font-weight: bold; font-size: 14px;
    }
    #fs-btn {
      background: #1f2937; color: #fff; border: 0; border-radius: 6px;
      padding: 7px 12px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    #fs-btn:hover { background: #374151; }

    /* Trên điện thoại: tràn toàn màn hình, bỏ khung */
    @media (max-width: 600px) {
      #frame { height: 100vh; max-height: none; width: 100vw; aspect-ratio: auto; border: 0; border-radius: 0; }
      #footer { display: none; }
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="canvas-wrap">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div>Đang tải...</div>
        <div id="bar-bg"><div id="bar"></div></div>
      </div>
    </div>
    <div id="footer">
      <span>{{{ PRODUCT_NAME }}}</span>
      <button id="fs-btn">Toàn màn hình</button>
    </div>
  </div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      showBanner: function (msg, type) { console.log(type + ": " + msg); }
    };

    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var bar = document.querySelector("#bar");
    var unityInstance = null;

    createUnityInstance(canvas, config, function (progress) {
      bar.style.width = (progress * 100) + "%";
    }).then(function (instance) {
      unityInstance = instance;
      loading.style.display = "none";
    }).catch(function (err) { alert(err); });

    document.querySelector("#fs-btn").onclick = function () {
      if (unityInstance) unityInstance.SetFullscreen(1);
    };
  </script>
</body>
</html>
