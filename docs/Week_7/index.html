<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bus Escape - Traffic Jam</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Khung điện thoại: Tự động điều chỉnh chiều rộng để Canvas luôn đạt chuẩn 9:16 */
    #frame {
      display: flex;
      flex-direction: column;
      height: 94vh;
      max-height: 920px;
      max-width: 100vw;
      background: #161b22;
      border: 3px solid #30363d;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .7);
    }

    /* Vùng hiển thị Canvas: Khóa cứng đúng tỉ lệ 9:16 (1080x1920) của dự án */
    #canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      aspect-ratio: 9 / 16;
      background: #B0C0D0; /* Màu nền trùng với background Camera để không bị giật màu */
      margin: 0 auto;
      overflow: hidden;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #f3f4f6;
      font-size: 14px;
      gap: 14px;
      z-index: 10;
    }
    #loading-text {
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #bar-bg {
      width: 65%;
      height: 8px;
      background: #374151;
      border-radius: 6px;
      overflow: hidden;
    }
    #bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 6px;
      transition: width 0.15s ease-out;
    }

    #footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #161b22;
      border-top: 1px solid #21262d;
      color: #e6edf3;
      font-weight: 600;
      font-size: 13px;
      gap: 12px;
    }
    #footer span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #fs-btn {
      background: #238636;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }
    #fs-btn:hover { background: #2ea043; }
    #fs-btn:active { background: #238636; transform: scale(0.97); }

    /* Trên điện thoại (Mobile): Tràn toàn màn hình, tận dụng tối đa Safe Area và responsive của game */
    @media (max-width: 600px) {
      body { background: #000; }
      #frame {
        height: 100vh;
        max-height: none;
        width: 100vw;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      #canvas-wrap {
        width: 100%;
        height: 100%;
        aspect-ratio: auto; /* Cho phép co giãn tự do theo màn hình thật của điện thoại */
      }
      #footer { display: none; }
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="canvas-wrap">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div id="loading-text">Đang tải...</div>
        <div id="bar-bg"><div id="bar"></div></div>
      </div>
    </div>
    <div id="footer">
      <span>Bus Escape - Traffic Jam</span>
      <button id="fs-btn">Toàn màn hình</button>
    </div>
  </div>

  <script src="Build/Week_7.loader.js"></script>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/Week_7.data",
      frameworkUrl: buildUrl + "/Week_7.framework.js",
      codeUrl: buildUrl + "/Week_7.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Bus Escape - Traffic Jam",
      productVersion: "1.2",
      showBanner: function (msg, type) { console.log(type + ": " + msg); }
    };

    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var bar = document.querySelector("#bar");
    var unityInstance = null;

    createUnityInstance(canvas, config, function (progress) {
      bar.style.width = (progress * 100) + "%";
    }).then(function (instance) {
      unityInstance = instance;
      loading.style.display = "none";
    }).catch(function (err) { alert(err); });

    document.querySelector("#fs-btn").onclick = function () {
      if (unityInstance) unityInstance.SetFullscreen(1);
    };
  </script>
</body>
</html>
